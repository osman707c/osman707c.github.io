<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akıllı Edit Motoru</title>
</head>
<body>
<script>
/* =========================================================
   AKILLI EDIT MOTORU
   Bu dosya mevcut index.html içine eklenebilir.
   Amaç: tekrarlayan klipleri azaltmak, kötü sahneleri elemek,
   müzik ritmine göre plan kurmak ve kullanıcı tercihlerini öğrenmek.
   ========================================================= */

const SmartEdit = {
  history: JSON.parse(localStorage.getItem("smartEditHistory") || "[]"),

  saveHistory() {
    localStorage.setItem("smartEditHistory", JSON.stringify(this.history.slice(-200)));
  },

  // Kare benzerliği için basit parmak izi
  frameFingerprint(canvas) {
    const ctx = canvas.getContext("2d");
    const w = 32, h = 18;
    ctx.drawImage(canvas, 0, 0, w, h);
    const data = ctx.getImageData(0, 0, w, h).data;

    let sum = 0, r = 0, g = 0, b = 0;
    for (let i = 0; i < data.length; i += 4) {
      r += data[i];
      g += data[i + 1];
      b += data[i + 2];
      sum++;
    }

    return {
      r: r / sum,
      g: g / sum,
      b: b / sum,
      brightness: (r + g + b) / (3 * sum)
    };
  },

  // İki sahnenin benzer olup olmadığı
  isTooSimilar(a, b) {
    if (!a || !b) return false;

    const diff =
      Math.abs(a.r - b.r) +
      Math.abs(a.g - b.g) +
      Math.abs(a.b - b.b);

    return diff < 45;
  },

  // Sahne puanlama
  scoreScene(scene, fingerprint, motionScore) {
    let score = 50;

    // Hareketli sahneler daha iyi
    score += Math.min(30, (motionScore || 0) * 3);

    // Çok karanlık veya aşırı parlak sahneleri cezalandır
    if (fingerprint.brightness < 35) score -= 35;
    if (fingerprint.brightness > 225) score -= 25;

    // Kullanıcının geçmiş tercihleri
    for (const item of this.history) {
      if (item.rating === "good") score += item.weight || 5;
      if (item.rating === "bad") score -= item.weight || 5;
    }

    return Math.max(0, Math.min(100, score));
  },

  // Kötü ve tekrarlı sahneleri ele
  filterScenes(scenes) {
    const selected = [];
    const used = [];

    for (const scene of scenes) {
      const fp = this.frameFingerprint(scene.canvas);

      // Boş, karanlık veya aşırı parlak sahne
      if (fp.brightness < 30 || fp.brightness > 230) continue;

      // Tekrar kontrolü
      const repeated = used.some(prev => this.isTooSimilar(prev, fp));
      if (repeated) continue;

      scene.fingerprint = fp;
      scene.score = this.scoreScene(scene, fp, scene.motionScore || 0);

      selected.push(scene);
      used.push(fp);
    }

    // En iyi sahneleri öne al
    return selected.sort((a, b) => b.score - a.score);
  },

  // Müzik enerjisine göre edit planı
  buildPlan(goodScenes, musicBeats, targetDuration) {
    const plan = [];
    let time = 0;
    let index = 0;

    const beats = musicBeats && musicBeats.length
      ? musicBeats
      : Array.from({ length: 40 }, (_, i) => i * 0.5);

    for (const beat of beats) {
      if (time >= targetDuration) break;
      if (index >= goodScenes.length) index = 0;

      const scene = goodScenes[index++];
      const beatIndex = beats.indexOf(beat);
      const nextBeat = beats[beatIndex + 1] || beat + 0.5;

      let clipDuration = Math.max(0.18, nextBeat - beat);

      // Yüksek enerjide daha kısa kesme
      if (scene.energy === "high") clipDuration *= 0.7;

      // Sakin bölümde daha uzun plan
      if (scene.energy === "low") clipDuration *= 1.4;

      plan.push({
        start: time,
        duration: clipDuration,
        scene,
        effect: scene.energy === "high"
          ? "zoom-shake-flash"
          : "soft-zoom",
        text: scene.score > 80
          ? "GOL"
          : scene.score > 65
          ? "FENA"
          : ""
      });

      time += clipDuration;
    }

    return plan;
  },

  // Kullanıcı geri bildirimi
  rateEdit(plan, rating) {
    for (const item of plan) {
      this.history.push({
        rating,
        motionScore: item.scene.motionScore || 0,
        brightness: item.scene.fingerprint?.brightness || 0,
        effect: item.effect,
        weight: rating === "good" ? 6 : -6
      });
    }

    this.saveHistory();
  },

  // Öğrenilen tercihleri sıfırla
  resetLearning() {
    this.history = [];
    localStorage.removeItem("smartEditHistory");
  }
};

/* =========================================================
   KULLANIM ÖRNEĞİ
   =========================================================

   1. Videodan sahneleri çıkar:
      allScenes = [
        {
          canvas: canvasElement,
          startTime: 3.2,
          endTime: 4.1,
          motionScore: 8,

        }
      ];

   2. Kötü ve tekrarlı sahneleri filtrele:
      const goodScenes = SmartEdit.filterScenes(allScenes);

   3. Müzik beatleriyle plan kur:
      const editPlan = SmartEdit.buildPlan(
        goodScenes,
        musicBeats,
        15
      );

   4. Render sırasında kullan:
      editPlan.forEach(item => {
        // item.scene
        // item.start
        // item.duration
        // item.effect
        // item.text
      });

   5. Kullanıcı editi beğenirse:
      SmartEdit.rateEdit(editPlan, "good");

   6. Beğenmezse:
      SmartEdit.rateEdit(editPlan, "bad");
   ========================================================= */
</script>
</body>
</html>
