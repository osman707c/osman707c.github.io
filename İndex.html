<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Kick Mod Panel</title>
<script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #08080a; color: #f2f2f2; overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

  #header { background: linear-gradient(180deg, #17171a, #121214); border-bottom: 1px solid #232326; padding: 12px 14px; flex-shrink: 0; }
  #header h1 { font-size: 17px; margin: 0 0 10px 0; display:flex; align-items:center; justify-content:space-between; }
  .kick-logo { color: #53fc18; font-weight: 900; letter-spacing: 0.5px; }
  #gearBtn { background: #1e1e22; border: none; color: #c7c7cc; font-size: 17px; padding: 7px 10px; border-radius: 10px; }
  #loginRow button { width: 100%; padding: 13px; border-radius: 10px; border: none; background: linear-gradient(135deg,#53fc18,#3ed80f); color: #000; font-weight: 800; font-size: 15px; }
  #connectForm { display: flex; flex-direction: column; gap: 8px; }
  #connectForm input { padding: 11px 12px; border-radius: 10px; border: 1px solid #2b2b2f; background: #0e0e11; color: #fff; font-size: 15px; }
  #connectForm input:focus { outline: none; border-color: #53fc18; }
  #connectForm button { padding: 11px; border-radius: 10px; border: none; background: linear-gradient(135deg,#53fc18,#3ed80f); color: #000; font-weight: 800; }
  #recentChips { display: flex; gap: 6px; flex-wrap: wrap; }
  #recentChips button { width: auto; background: #1e1e22; color: #c7c7cc; border: 1px solid #2b2b2f; border-radius: 14px; padding: 6px 12px; font-size: 12.5px; }
  #connectedBar { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: #9c9ca3; }
  #connectedBar .left { display:flex; align-items:center; gap:6px; }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #53fc18; animation: pulse 1.5s infinite; flex-shrink:0; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(83,252,24,0.5);} 70%{box-shadow:0 0 0 6px rgba(83,252,24,0);} 100%{box-shadow:0 0 0 0 rgba(83,252,24,0);} }
  #connectedBar b { color: #53fc18; }
  #viewerCount { color: #6b6b70; font-size: 12px; }
  #connectedBar button { background: #1e1e22; color: #c7c7cc; border: 1px solid #2b2b2f; border-radius: 8px; padding: 6px 10px; font-size: 12px; }
  .hidden { display: none !important; }

  #chatFeed { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; scroll-behavior: smooth; }
  .msg { display: flex; gap: 8px; animation: slideIn 0.18s ease-out; }
  @keyframes slideIn { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform: translateY(0); } }
  .avatar { width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; color:#000; margin-top:2px; }
  .msg-body { flex: 1; background: #141417; border-radius: 12px; padding: 8px 11px; font-size: 14.5px; line-height: 1.5; border: 1px solid #1e1e22; min-width: 0; }
  .msg.mention .msg-body { border-color: #f7a600; background: #241d0c; }
  .msg-top { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  .msg .uname { font-weight: 800; color: #53fc18; cursor: pointer; }
  .badge { font-size: 9.5px; font-weight: 800; padding: 1px 5px; border-radius: 4px; text-transform: uppercase; }
  .badge.mod { background: #2b90d9; color: #fff; }
  .badge.vip { background: #e0245e; color: #fff; }
  .badge.sub { background: #f7a600; color: #000; }
  .badge.og { background: #53fc18; color: #000; }
  .msg-time { font-size: 10.5px; color: #55555a; margin-left: auto; flex-shrink: 0; }
  .msg .txt { color: #e5e5e8; word-break: break-word; margin-top: 2px; display:block; }
  .msg .txt a { color: #7cc4f7; }
  .emote-img { height: 22px; vertical-align: middle; margin: 0 1px; }

  #inputBar { flex-shrink: 0; border-top: 1px solid #232326; background: #121214; padding: 9px 10px; }
  #replyPreview { display: flex; justify-content: space-between; align-items: center; background: #172230; border-radius: 8px; padding: 7px 11px; margin-bottom: 7px; font-size: 12.5px; color: #7cc4f7; }
  #replyPreview button { background: none; border: none; color: #7cc4f7; font-size: 16px; }
  #sendRow { display: flex; gap: 6px; align-items: center; }
  #sendRow input { flex: 1; padding: 12px 14px; border-radius: 22px; border: 1px solid #2b2b2f; background: #0e0e11; color: #fff; font-size: 15px; }
  #sendRow input:focus { outline: none; border-color: #53fc18; }
  #sendRow button.send { background: linear-gradient(135deg,#53fc18,#3ed80f); color: #000; border: none; border-radius: 22px; padding: 0 18px; height: 44px; font-weight: 800; flex-shrink:0; }
  #emoteBtn { background: #1e1e22; color: #fff; border: 1px solid #2b2b2f; border-radius: 50%; width: 44px; height: 44px; font-size: 19px; flex-shrink: 0; padding:0; }

  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.65); display: flex; align-items: flex-end; z-index: 50; animation: fadeIn 0.15s ease-out; }
  @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
  #sheet { background: #17171a; width: 100%; max-height: 82vh; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 18px; border-top: 1px solid #262629; }
  #sheet h3 { margin: 0 0 14px 0; font-size: 17px; color: #53fc18; display:flex; align-items:center; gap:8px; }
  #sheet .opt { width: 100%; text-align: left; background: #0e0e11; border: 1px solid #232326; color: #fff; padding: 14px; border-radius: 10px; margin-bottom: 8px; font-size: 15px; display:flex; align-items:center; gap:10px; }
  #sheet .opt.danger { color: #ff7b7b; border-color: #3a1616; }
  #sheet .customRow { display: flex; gap: 8px; margin-bottom: 8px; }
  #sheet .customRow input { flex: 1; padding: 13px; border-radius: 10px; border: 1px solid #2b2b2f; background: #0e0e11; color: #fff; }
  #sheet .customRow button { background: #f7a600; color: #000; border: none; border-radius: 10px; padding: 0 18px; font-weight: 800; }
  #sheetCancel { width: 100%; padding: 13px; background: #232326; color: #fff; border: none; border-radius: 10px; margin-top: 6px; font-weight: 600; }

  .emoteGrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .emoteGrid img { width: 100%; border-radius: 8px; background: #0e0e11; padding: 5px; border: 1px solid #232326; }

  .settingSection { margin-bottom: 20px; }
  .settingSection h4 { margin: 0 0 10px 0; font-size: 13px; color: #6b6b70; text-transform: uppercase; letter-spacing: 0.5px; }
  .toggleRow { display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid #1e1e22; }
  .toggleRow span { font-size: 14.5px; }
  .switch { width: 46px; height: 27px; background: #2b2b2f; border-radius: 14px; position: relative; border: none; flex-shrink:0; transition: 0.15s; }
  .switch.on { background: #53fc18; }
  .switch .dot { position: absolute; top: 3px; left: 3px; width: 21px; height: 21px; background: #fff; border-radius: 50%; transition: 0.15s; }
  .switch.on .dot { left: 22px; }
  .wordRow { display: flex; gap: 6px; align-items: center; background:#0e0e11; border:1px solid #232326; border-radius:10px; padding:9px; margin-bottom:6px; }
  .wordRow span { flex: 1; font-size: 13.5px; }
  .wordRow select { background:#17171a; color:#fff; border:1px solid #2b2b2f; border-radius:6px; font-size:12px; padding: 3px; }
  .wordRow button { width:auto; background:none; border:none; color:#ff7b7b; font-size:17px; padding:0 4px; }
  #addWordRow { display: flex; gap: 6px; margin-top: 8px; }
  #addWordRow input { flex: 1; padding: 11px; border-radius: 10px; border: 1px solid #2b2b2f; background: #0e0e11; color: #fff; }
  #addWordRow button { width: auto; background: #53fc18; color: #000; border: none; border-radius: 10px; padding: 0 16px; font-weight: 800; }

  #toast { position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%); background: #17171a; border: 1px solid #262629; padding: 11px 18px; border-radius: 22px; font-size: 13px; z-index: 60; display: none; max-width: 90%; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
  #toast.ok { color: #7ee787; }
  #toast.err { color: #ff7b7b; }

  #emptyState { flex: 1; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px; color:#4a4a4f; padding: 30px; text-align:center; }
  #emptyState .icon { font-size: 40px; }
</style>
</head>
<body>
<div id="app">

  <div id="header">
    <h1>
      <span><span class="kick-logo">KICK</span> Mod Panel</span>
      <button id="gearBtn" onclick="openSettings()">⚙</button>
    </h1>

    <div id="loginRow">
      <button onclick="login()">Kick ile Giriş Yap</button>
    </div>

    <div id="connectForm" class="hidden">
      <input id="channelSlug" placeholder="Moderatör olduğun kanal (kullanıcı adı)">
      <input id="myUsername" placeholder="Senin kullanıcı adın (etiketlenince uyarı için)">
      <button onclick="connectChat()">Chat'e Bağlan</button>
      <div id="recentChips"></div>
    </div>

    <div id="connectedBar" class="hidden">
      <span class="left"><span class="live-dot"></span> <b id="connectedName"></b> <span id="viewerCount"></span></span>
      <button onclick="disconnectChat()">Bağlantıyı Kes</button>
    </div>

    <button id="logoutBtn" class="hidden" onclick="logout()" style="margin-top:8px;width:100%;background:#241414;color:#ff7b7b;border:1px solid #3a1616;border-radius:10px;padding:9px;font-size:13px;">Çıkış Yap</button>
  </div>

  <div id="chatFeed"></div>
  <div id="emptyState" class="hidden">
    <div class="icon">💬</div>
    <div>Henüz bir kanala bağlanmadın</div>
  </div>

  <div id="inputBar" class="hidden">
    <div id="replyPreview" class="hidden">

      <button id="emoteBtn" onclick="openEmotePicker()">😀</button>
      <input id="msgInput" placeholder="Mesaj yaz..." onkeydown="if(event.key==='Enter') sendMessage()">
      <button class="send" onclick="sendMessage()">Gönder</button>
    </div>
  </div>

</div>

<div id="toast"></div>

<script>
  const CLIENT_ID = "01M15ZM2GVKJTEW8GPDHR76ZVX";
  const CLIENT_SECRET = "0c3df1b79afb945f58302994ada17af91e23202a5b5d403c29d8917f7dcaf809";
  const REDIRECT_URI = "https://osman707c.github.io/";
  const PUSHER_KEY = "32cbd69e4b950bf97679";
  const PUSHER_CLUSTER = "us2";
</script>

<script>
const TOKEN_KEY = "kick_mod_panel_token";
const VERIFIER_KEY = "kick_mod_panel_verifier";
const RECENT_KEY = "kick_mod_panel_recent";
const SETTINGS_KEY = "kick_mod_panel_settings";

let broadcasterId = null;
let broadcasterSlug = null;
let myUsername = "";
let replyTarget = null;
let currentSheetUser = null;
let pusherChannel = null;
let channelEmotes = [];

let settings = loadSettings();
function loadSettings() {
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    if (raw) return Object.assign({ showEmotes: true, autoModOn: true, bannedWords: [] }, JSON.parse(raw));
  } catch(e) {}
  return { showEmotes: true, autoModOn: true, bannedWords: [] };
}
function saveSettings() { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }

function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = type;
  el.style.display = 'block';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => { el.style.display = 'none'; }, 3200);
}

function base64url(buf) {
  return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
async function sha256(str) { return await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)); }
function randomString(len) {
  const arr = new Uint8Array(len);
  crypto.getRandomValues(arr);
  return base64url(arr.buffer);
}

async function login() {
  const verifier = randomString(64);
  localStorage.setItem(VERIFIER_KEY, verifier);
  const challenge = base64url(await sha256(verifier));
  const params = new URLSearchParams({
    client_id: CLIENT_ID,
    redirect_uri: REDIRECT_URI,
    response_type: "code",
    scope: "user:read channel:read moderation:ban chat:write",
    code_challenge: challenge,
    code_challenge_method: "S256",
    state: "modpanel"
  });
  window.location.href = "https://id.kick.com/oauth/authorize?" + params.toString();
}

async function exchangeCodeForToken(code) {
  const verifier = localStorage.getItem(VERIFIER_KEY);
  const body = new URLSearchParams({
    grant_type: "authorization_code",
    client_id: CLIENT_ID,
    client_secret: CLIENT_SECRET,
    redirect_uri: REDIRECT_URI,
    code: code,
    code_verifier: verifier || ""
  });
  const res = await fetch("https://id.kick.com/oauth/token", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: body.toString()
  });
  const data = await res.json().catch(() => ({}));
  if (data.access_token) {
    localStorage.setItem(TOKEN_KEY, data.access_token);
    return true;
  }
  toast("Giriş başarısız: " + (data.error_description || data.error || "bilinmeyen hata"), "err");
  return false;
}

async function getUserIdBySlug(slug) {
  const token = localStorage.getItem(TOKEN_KEY);
  if (!token) throw new Error("Giriş yapılmamış. Sayfayı yenile ve tekrar giriş yap.");

  const res = await fetch("https://api.kick.com/public/v1/channels?slug=" + encodeURIComponent(slug), {
    headers: { "Authorization": "Bearer " + token }
  });

  if (res.status === 401) throw new Error("Giriş süresi dolmuş. 'Çıkış Yap' yapıp tekrar giriş dene.");

  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error("API hatası (" + res.status + "): " + (data.message || "bilinmeyen hata"));
  if (data.data && data.data.length > 0) return data.data[0].broadcaster_user_id;
  throw new Error("Kullanıcı bulunamadı: " + slug);
}

function showLoggedInUI() {
  document.getElementById('loginRow').classList.add('hidden');
  document.getElementById('connectForm').classList.remove('hidden');
  document.getElementById('logoutBtn').classList.remove('hidden');
  document.getElementById('emptyState').classList.remove('hidden');
  renderRecentChips();
}

function logout() {
  localStorage.removeItem(TOKEN_KEY);
  location.reload();
}

function getRecent() {
  try { return JSON.parse(localStorage.getItem(RECENT_KEY) || "[]"); } catch(e) { return []; }
}
function addRecent(slug) {
  let list = getRecent().filter(s => s !== slug);
  list.unshift(slug);
  list = list.slice(0, 6);
  localStorage.setItem(RECENT_KEY, JSON.stringify(list));
}
function renderRecentChips() {
  const box = document.getElementById('recentChips');
  const list = getRecent();
  box.innerHTML = list.map(s => `<button onclick="quickConnect('${s}')">🔁 ${escapeHtml(s)}</button>`).join('');
}
function quickConnect(slug) {
  document.getElementById('channelSlug').value = slug;
  connectChat();
}

async function connectChat() {
  const slug = document.getElementById('channelSlug').value.trim().toLowerCase();
  myUsername = document.getElementById('myUsername').value.trim().toLowerCase();
  if (!slug) { toast("Kanal kullanıcı adını yaz.", "err"); return; }
  toast("Bağlanılıyor...", "ok");

  try {
    broadcasterId = await getUserIdBySlug(slug);
    broadcasterSlug = slug;

    const infoRes = await fetch("https://kick.com/api/v2/channels/" + encodeURIComponent(slug));
    if (!infoRes.ok) throw new Error("Kanal bilgisi alınamadı.");
    const info = await infoRes.json();
    const chatroomId = info.chatroom && info.chatroom.id;
    if (!chatroomId) throw new Error("Chatroom ID bulunamadı.");

    if (info.livestream && info.livestream.viewer_count != null) {
      document.getElementById('viewerCount').textContent = "· " + info.livestream.viewer_count + " izleyici";
    } else {
      document.getElementById('viewerCount').textContent = "";
    }

    const pusher = new Pusher(PUSHER_KEY, { cluster: PUSHER_CLUSTER });
    pusherChannel = pusher.subscribe("chatrooms." + chatroomId + ".v2");
    pusherChannel.bind("App\\Events\\ChatMessageEvent", function(raw) {
      let data = raw;
      if (typeof raw === "string") { try { data = JSON.parse(raw); } catch(e) { return; } }
      addChatMessage(data);
    });

    loadChannelEmotes(slug);
    addRecent(slug);

    document.getElementById('connectForm').classList.add('hidden');
    document.getElementById('connectedBar').classList.remove('hidden');
    document.getElementById('connectedName').textContent = slug;
    document.getElementById('inputBar').classList.remove('hidden');
    document.getElementById('emptyState').classList.add('hidden');
    document.getElementById('chatFeed').innerHTML = "";

    if ("Notification" in window && Notification.permission === "default") {
      Notification.requestPermission();
    }
    toast("Bağlandı: " + slug, "ok");
  } catch (e) {
    toast(e.message, "err");
  }
}

function disconnectChat() { location.reload(); }

async function loadChannelEmotes(slug) {
  channelEmotes = [];
  try {
    const res = await fetch("https://kick.com/emotes/" + encodeURIComponent(slug));
    if (!res.ok) return;
    const data = await res.json();
    const packs = Array.isArray(data) ? data : [data];
    packs.forEach(pack => {
      if (pack && Array.isArray(pack.emotes)) {
        pack.emotes.forEach(em => {
          if (em && em.id && em.name) channelEmotes.push({ id: em.id, name: em.name });
        });
      }
    });
  } catch (e) { /* sessizce geç */ }
}

function escapeHtml(str) {
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function renderMessageContent(content) {
  let safe = escapeHtml(content);
  if (settings.showEmotes) {
    safe = safe.replace(/\[emote:(\d+):([^\]]+)\]/g, (m, id, name) =>
      `<img class="emote-img" src="https://files.kick.com/emotes/${id}/fullsize" alt="${name}" title="${name}">`);
  } else {
    safe = safe.replace(/\[emote:(\d+):([^\]]+)\]/g, (m, id, name) => `:${name}:`);
  }
  safe = safe.replace(/(https?:\/\/[^\s<]+)/g, (url) => `<a href="${url}" target="_blank" rel="noopener">${url}</a>`);
  return safe;
}

const AVATAR_COLORS = ["#53fc18","#f7a600","#e0245e","#2b90d9","#a855f7","#22c55e","#eab308","#ef4444"];
function avatarColor(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
}

function badgeHtml(identity) {
  if (!identity || !Array.isArray(identity.badges)) return "";
  return identity.badges.map(b => {
    const type = (b.type || "").toLowerCase();
    if (type.includes("moderator")) return `<span class="badge mod">MOD</span>`;
    if (type.includes("vip")) return `<span class="badge vip">VIP</span>`;
    if (type.includes("subscriber") || type.includes("sub")) return `<span class="badge sub">SUB</span>`;
    if (type.includes("og")) return `<span class="badge og">OG</span>`;
    return "";
  }).join("");
}

function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    osc.start();
    osc.stop(ctx.currentTime + 0.2);
  } catch(e) {}
}

function checkAutoMod(content, userId, username) {
  if (!settings.autoModOn || !settings.bannedWords.length || !userId) return;
  const lower = content.toLowerCase();
  const hit = settings.bannedWords.find(w => lower.includes(w.word.toLowerCase()));
  if (hit) {
    currentSheetUser = { id: userId, username: username };
    if (hit.action === 'ban') doModAction('ban', null);
    else doModAction('timeout', hit.duration || 10);
    toast("🤖 Otomod: " + username + " → yasaklı kelime", "err");
  }
}

function addChatMessage(data) {
  const feed = document.getElementById('chatFeed');
  const username = (data.sender && data.sender.username) || "bilinmeyen";
  const userId = data.sender && data.sender.id;
  const content = data.content || "";
  const msgId = data.id || data.message_id || "";
  const identity = data.sender && data.sender.identity;
  const time = new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });

  const isMention = myUsername && content.toLowerCase().includes(myUsername);
  const initial = username.charAt(0).toUpperCase();

  const div = document.createElement('div');
  div.className = 'msg' + (isMention ? ' mention' : '');
  div.innerHTML = `
    <div class="avatar" style="background:${avatarColor(username)}">${initial}</div>
    <div class="msg-body">
      <div class="msg-top">
        <span class="uname" onclick='openSheet(${userId}, ${JSON.stringify(username)}, ${JSON.stringify(msgId)})'>${escapeHtml(username)}</span>
        ${badgeHtml(identity)}
        <span class="msg-time">${time}</span>
      </div>
      <span class="txt">${renderMessageContent(content)}</span>
    </div>
  `;
  feed.appendChild(div);
  feed.scrollTop = feed.scrollHeight;
  while (feed.children.length > 150) feed.removeChild(feed.firstChild);

  if (isMention) {
    playBeep();
    if ("Notification" in window && Notification.permission === "granted") {
      new Notification("Etiketlendin: " + username, { body: content });
    }
  }
  checkAutoMod(content, userId, username);
}

function openSheet(userId, username, msgId) {
  currentSheetUser = { id: userId, username: username, msgId: msgId };
  const overlay = document.createElement('div');
  overlay.id = 'overlay';
  overlay.onclick = (e) => { if (e.target.id === 'overlay') closeSheet(); };
  overlay.innerHTML = `
    <div id="sheet">
      <h3><span class="avatar" style="background:${avatarColor(username)};width:26px;height:26px;font-size:12px;">${escapeHtml(username.charAt(0).toUpperCase())}</span> ${escapeHtml(username)}</h3>
      <button class="opt" onclick="quickTimeout(10)">⏱ 10 dakika Timeout</button>
      <button class="opt" onclick="quickTimeout(30)">⏱ 30 dakika Timeout</button>
      <button class="opt" onclick="quickTimeout(60)">⏱ 1 saat Timeout</button>
      <div class="customRow">
        <input id="customDuration" type="number" placeholder="Özel süre (dk)">
        <button onclick="customTimeout()">Uygula</button>
      </div>
      <button class="opt danger" onclick="quickBan()">🚫 Kalıcı Ban</button>
      <button class="opt" onclick="startReply()">↩ Yanıtla</button>
      <button id="sheetCancel" onclick="closeSheet()">İptal</button>
    </div>
  `;
  document.body.appendChild(overlay);
}
function closeSheet() { const o = document.getElementById('overlay'); if (o) o.remove(); }

async function quickTimeout(minutes) { await doModAction('timeout', minutes); closeSheet(); }
async function customTimeout() {
  const val = document.getElementById('customDuration').value.trim();
  if (!val) { toast("Süre gir.", "err"); return; }
  await doModAction('timeout', parseInt(val));
  closeSheet();
}
async function quickBan() { await doModAction('ban', null); closeSheet(); }
function startReply() {
  replyTarget = { id: currentSheetUser.msgId, username: currentSheetUser.username };
  document.getElementById('replyPreview').classList.remove('hidden');
  document.getElementById('replyText').textContent = "↩ Yanıtlanıyor: " + currentSheetUser.username;
  document.getElementById('msgInput').focus();
  closeSheet();
}
function cancelReply() {
  replyTarget = null;
  document.getElementById('replyPreview').classList.add('hidden');
}

async function doModAction(type, durationMin) {
  const token = localStorage.getItem(TOKEN_KEY);
  const bodyObj = { broadcaster_user_id: broadcasterId, user_id: currentSheetUser.id };
  if (type === 'timeout') bodyObj.duration = durationMin;

  const res = await fetch("https://api.kick.com/public/v1/moderation/bans", {
    method: "POST",
    headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
    body: JSON.stringify(bodyObj)
  });
  if (res.ok) {
    toast("✅ " + currentSheetUser.username + " → " + (type === 'ban' ? "banlandı" : durationMin + " dk timeout"), "ok");
  } else if (res.status === 403 || res.status === 401) {
    toast("❌ Yetki hatası. Çıkış yapıp tekrar giriş dene.", "err");
  } else {
    const err = await res.json().catch(() => ({}));
    toast("❌ " + (err.message || res.status), "err");
  }
}

async function sendMessage() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text || !broadcasterId) return;

  const token = localStorage.getItem(TOKEN_KEY);
  const bodyObj = { broadcaster_user_id: broadcasterId, content: text, type: "user" };
  if (replyTarget && replyTarget.id) bodyObj.reply_to_message_id = replyTarget.id;

  const res = await fetch("https://api.kick.com/public/v1/chat", {
    method: "POST",
    headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
    body: JSON.stringify(bodyObj)
  });
  if (res.ok) {
    input.value = "";
    cancelReply();
  } else if (res.status === 403 || res.status === 401) {
    toast("❌ Mesaj izni yok. Çıkış yapıp tekrar giriş dene.", "err");
  } else {
    const err = await res.json().catch(() => ({}));
    toast("❌ Gönderilemedi: " + (err.message || res.status), "err");
  }
}

function openEmotePicker() {
  const overlay = document.createElement('div');
  overlay.id = 'overlay';
  overlay.onclick = (e) => { if (e.target.id === 'overlay') closeSheet(); };
  let gridHtml;
  if (!channelEmotes.length) {
    gridHtml = `<p style="color:#9c9ca3;font-size:13px;">Bu kanal için emote bulunamadı.</p>`;
  } else {
    gridHtml = `<div class="emoteGrid">` + channelEmotes.slice(0, 60).map(em =>
      `<img src="https://files.kick.com/emotes/${em.id}/fullsize" title="${escapeHtml(em.name)}" onclick="insertEmote(${em.id}, ${JSON.stringify(em.name)})">`
    ).join('') + `</div>`;
  }
  overlay.innerHTML = `<div id="sheet"><h3>😀 Emote Seç</h3>${gridHtml}<button id="sheetCancel" onclick="closeSheet()">Kapat</button></div>`;
  document.body.appendChild(overlay);
}
function insertEmote(id, name) {
  const input = document.getElementById('msgInput');
  input.value += `[emote:${id}:${name}] `;
  closeSheet();
  input.focus();
}

function openSettings() {
  const overlay = document.createElement('div');
  overlay.id = 'overlay';
  overlay.onclick = (e) => { if (e.target.id === 'overlay') closeSheet(); };

  const wordsHtml = settings.bannedWords.map((w, i) => `
    <div class="wordRow">
      <span>${escapeHtml(w.word)}</span>
      <select onchange="updateWordAction(${i}, this.value)">
        <option value="timeout" ${w.action==='timeout'?'selected':''}>Timeout ${w.duration||10}dk</option>
        <option value="ban" ${w.action==='ban'?'selected':''}>Kalıcı Ban</option>
      </select>
      <button onclick="removeWord(${i})">✕</button>
    </div>
  `).join('');

  overlay.innerHTML = `
    <div id="sheet">
      <h3>⚙ Ayarlar</h3>
      <div class="settingSection">
        <div class="toggleRow">
          <span>Emote görsellerini göster</span>
          <button class="switch ${settings.showEmotes?'on':''}" onclick="toggleSetting('showEmotes', this)"><div class="dot"></div></button>
        </div>
        <div class="toggleRow">
          <span>Otomatik moderasyon</span>
          <button class="switch ${settings.autoModOn?'on':''}" onclick="toggleSetting('autoModOn', this)"><div class="dot"></div></button>
        </div>
      </div>
      <div class="settingSection">
        <h4>Yasaklı Kelimeler</h4>
        <div id="wordList">${wordsHtml || '<p style="color:#666;font-size:13px;">Henüz kelime eklenmedi.</p>'}</div>
        <div id="addWordRow">
          <input id="newWord" placeholder="kelime yaz...">
          <button onclick="addWord()">Ekle</button>
        </div>
      </div>
      <div class="settingSection">
        <h4>Bildirim</h4>
        <button class="opt" onclick="testNotification()">🔔 Test bildirimi gönder</button>
      </div>
      <button id="sheetCancel" onclick="closeSheet()">Kapat</button>
    </div>
  `;
  document.body.appendChild(overlay);
}
function toggleSetting(key, btn) { settings[key] = !settings[key]; saveSettings(); btn.classList.toggle('on'); }
function addWord() {
  const input = document.getElementById('newWord');
  const word = input.value.trim();
  if (!word) return;
  settings.bannedWords.push({ word, action: 'timeout', duration: 10 });
  saveSettings(); closeSheet(); openSettings();
}
function removeWord(i) { settings.bannedWords.splice(i, 1); saveSettings(); closeSheet(); openSettings(); }
function updateWordAction(i, action) { settings.bannedWords[i].action = action; saveSettings(); }
function testNotification() {
  if (!("Notification" in window)) { toast("Tarayıcı desteklemiyor.", "err"); return; }
  if (Notification.permission === "granted") {
    new Notification("Test bildirimi", { body: "Bildirimler çalışıyor 🎉" });
  } else {
    Notification.requestPermission().then(p => {
      if (p === "granted") new Notification("Test bildirimi", { body: "Bildirimler çalışıyor 🎉" });
      else toast("Bildirim izni verilmedi.", "err");
    });
  }
}

(async function init() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const existingToken = localStorage.getItem(TOKEN_KEY);

  if (code) {
    const ok = await exchangeCodeForToken(code);
    window.history.replaceState({}, document.title, REDIRECT_URI);
    if (ok) showLoggedInUI();
  } else if (existingToken) {
    showLoggedInUI();
  }
})();
</script>
</body>
</html>
