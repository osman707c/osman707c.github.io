<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kick İzle</title>
<style>
  :root { color-scheme: dark; --bg:#0b0e0f; --fg:#e8eceb; --accent:#53fc18; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  form { display: flex; gap: 6px; padding: 8px; }
  input { flex: 1; min-width: 0; padding: 10px; border-radius: 8px; border: 1px solid #2a3130; background: #151a1b; color: var(--fg); font-size: 16px; }
  button { padding: 10px 14px; border: 0; border-radius: 8px; background: var(--accent); color: #000; font-weight: 700; font-size: 16px; }
  #player { width: 100%; aspect-ratio: 16 / 9; border: 0; background: #000; }
  #chat { flex: 1; width: 100%; border: 0; min-height: 0; }
  @media (orientation: landscape) and (min-width: 700px) {
    body { flex-direction: row; flex-wrap: wrap; }
    form { width: 100%; }
    #player { width: 70%; height: calc(100% - 60px); aspect-ratio: auto; }
    #chat { width: 30%; height: calc(100% - 60px); flex: none; }
  }
</style>
</head>
<body>
  <form id="f">
    <input id="ch" placeholder="kanal adı (ör. xqc)" autocapitalize="off" autocomplete="off">
    <button>İzle</button>
  </form>
  <iframe id="player" allowfullscreen allow="autoplay; fullscreen; picture-in-picture"></iframe>
  <iframe id="chat"></iframe>
<script>
  const $ = id => document.getElementById(id);
  function load(name) {
    name = (name || "").trim().toLowerCase();
    if (!name) return;
    $("player").src = "https://player.kick.com/" + encodeURIComponent(name);
    $("chat").src = "https://kick.com/popout/" + encodeURIComponent(name) + "/chat";
    $("ch").value = name;
    location.hash = name;
    try { localStorage.setItem("lastChannel", name); } catch (e) {}
  }
  $("f").addEventListener("submit", e => { e.preventDefault(); load($("ch").value); });
  let last = "";
  try { last = localStorage.getItem("lastChannel") || ""; } catch (e) {}
  load(location.hash.slice(1) || last);
</script>
</body>
</html>
