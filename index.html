<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kick İzle</title>
<style>
  :root { color-scheme: dark; --bg:#0b0e0f; --card:#151a1b; --line:#2a3130; --fg:#e8eceb; --mut:#8b9694; --accent:#53fc18; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; }
  body { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .hidden { display: none !important; }

  /* Menü */
  #menu { max-width: 560px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; margin: 8px 0 16px; }
  h1 span { color: var(--accent); }
  form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--fg); font-size: 16px; }
  .btn { padding: 12px 16px; border: 0; border-radius: 10px; background: var(--accent); color: #000; font-weight: 700; font-size: 16px; }
  h2 { font-size: 13px; color: var(--mut); text-transform: uppercase; letter-spacing: .06em; margin: 22px 0 8px; }
  .item { display: flex; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; overflow: hidden; }
  .item .name { flex: 1; padding: 16px; font-size: 17px; font-weight: 600; background: none; border: 0; color: var(--fg); text-align: left; }
  .item .x { padding: 16px; background: none; border: 0; color: var(--mut); font-size: 18px; }
  .empty { color: var(--mut); font-size: 14px; }

  /* İzleme */
  #watch { height: 100%; display: flex; flex-direction: column; }
  #bar { display: flex; align-items: center; gap: 8px; padding: 8px; }
  #back { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); font-size: 15px; white-space: nowrap; }
  #chips { display: flex; gap: 6px; overflow-x: auto; flex: 1; scrollbar-width: none; }
  #chips::-webkit-scrollbar { display: none; }
  .chip { padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--fg); font-size: 14px; white-space: nowrap; }
  .chip.on { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 700; }
  #stage { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #player { width: 100%; aspect-ratio: 16 / 9; border: 0; background: #000; flex: none; }
  #chat { flex: 1; width: 100%; border: 0; min-height: 0; }
  @media (orientation: landscape) and (min-width: 700px) {
    #stage { flex-direction: row; }
    #player { width: 72%; height: 100%; aspect-ratio: auto; }
    #chat { width: 28%; flex: none; height: 100%; }
  }
</style>
</head>
<body>

<div id="menu">
  <h1><span>Kick</span> İzle</h1>
  <form id="f">
    <input id="ch" placeholder="kanal adı (ör. xqc)" autocapitalize="off" autocomplete="off" autocorrect="off">
    <button class="btn">İzle</button>
  </form>
  <h2>Önceden izlediklerin</h2>
  <div id="list"></div>
</div>

<div id="watch" class="hidden">
  <div id="bar">
    <button id="back">← Menü</button>
    <div id="chips"></div>
  </div>
  <div id="stage">
    <iframe id="player" allowfullscreen allow="autoplay; fullscreen; picture-in-picture"></iframe>
    <iframe id="chat"></iframe>
  </div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const KEY = "kickHistory";

  function getHist() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; }
  }
  function setHist(h) {
    try { localStorage.setItem(KEY, JSON.stringify(h.slice(0, 30))); } catch (e) {}
  }
  function clean(n) { return (n || "").trim().toLowerCase().replace(/^.*kick\.com\//, "").replace(/[^a-z0-9_-]/g, ""); }

  function renderMenu() {
    const h = getHist(), box = $("list");
    box.innerHTML = "";
    if (!h.length) { box.innerHTML = '<div class="empty">Henüz kanal yok. Yukarı bir kanal adı yaz.</div>'; return; }
    h.forEach(name => {
      const row = document.createElement("div"); row.className = "item";
      const b = document.createElement("button"); b.className = "name"; b.textContent = name;
      b.onclick = () => openChannel(name);
      const x = document.createElement("button"); x.className = "x"; x.textContent = "✕";
      x.onclick = () => { setHist(getHist().filter(c => c !== name)); renderMenu(); };
      row.append(b, x); box.append(row);
    });
  }

  function renderChips(current) {
    const box = $("chips"); box.innerHTML = "";
    getHist().forEach(name => {
      const c = document.createElement("button");
      c.className = "chip" + (name === current ? " on" : "");
      c.textContent = name;
      c.onclick = () => openChannel(name);
      box.append(c);
    });
    const on = box.querySelector(".on"); if (on) on.scrollIntoView({ inline: "center", block: "nearest" });
  }

  function openChannel(name) {
    name = clean(name); if (!name) return;
    // Sıra sabit kalsın: yeni kanal başa eklenir, eski kanalın yeri değişmez
    let h = getHist();
    if (!h.includes(name)) h.unshift(name);
    setHist(h);
    $("menu").classList.add("hidden");
    $("watch").classList.remove("hidden");
    $("player").src = "https://player.kick.com/" + encodeURIComponent(name);
    $("chat").src = "https://kick.com/popout/" + encodeURIComponent(name) + "/chat";
    renderChips(name);
    history.pushState({ ch: name }, "", "#" + name);
  }

  function showMenu() {
    $("player").src = "about:blank"; $("chat").src = "about:blank";
    $("watch").classList.add("hidden");
    $("menu").classList.remove("hidden");
    $("ch").value = "";
    renderMenu();
  }

  $("f").addEventListener("submit", e => { e.preventDefault(); openChannel($("ch").value); });
  $("back").onclick = () => { history.pushState(null, "", location.pathname); showMenu(); };
  window.addEventListener("popstate", () => {
    const n = clean(location.hash.slice(1));
    if (n) openChannel(n); else showMenu();
  });

  const start = clean(location.hash.slice(1));
  if (start) openChannel(start); else showMenu();
</script>
</body>
</html>
